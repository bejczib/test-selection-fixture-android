format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

meta:
  bitrise.io:
    stack: ubuntu-noble-24.04-bitrise-2025-android
    machine_type_id: elite

app:
  envs:
  - PROJECT_LOCATION: .
  - MODULE: app
  - VARIANT: debug

trigger_map:
- push_branch: "*"
  workflow: selective_tests
- pull_request_target_branch: main
  workflow: selective_tests

workflows:
  # Baseline: every module's unit tests. Compare its Test Reports with selective_tests.
  full_tests:
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $PROJECT_LOCATION/gradlew
    - script@1:
        title: Run all unit tests
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euxo pipefail
            ./gradlew test --continue
    - deploy-to-bitrise-io@2: {}

  # Branch build of Android Unit Test: reads test-selection.json itself, skips when nothing is selected.
  selective_tests:
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $PROJECT_LOCATION/gradlew
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        # Push builds have no BITRISEIO_GIT_BRANCH_DEST; diff against main explicitly.
        - base_ref: main
        - project_type: gradle
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/bitrise-step-android-unit-test.git@test-selection:
        inputs:
        - project_location: $PROJECT_LOCATION
        - variant: $VARIANT
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
    - script@1:
        title: Show selection
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -n "${BITRISE_TEST_SELECTION_PATH:-}" ]; then cat "$BITRISE_TEST_SELECTION_PATH"; fi
    - deploy-to-bitrise-io@2: {}

  # The script-based consumer, kept for comparison.
  selective_tests_script:
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: $PROJECT_LOCATION/gradlew
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        - base_ref: main
        - project_type: gradle
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - script@1:
        title: Run selected unit tests
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            echo "mode: ${BITRISE_TEST_SELECTION_MODE:-?}  summary: ${BITRISE_TEST_SELECTION_SUMMARY:-?}"
            if [ -z "${BITRISE_TEST_SELECTION_GRADLE_TASKS_PATH:-}" ]; then
              echo "no task list: running every unit test"
              set -x
              ./gradlew test --continue
            else
              echo "selected tasks:"; cat "$BITRISE_TEST_SELECTION_GRADLE_TASKS_PATH"
              set -x
              ./gradlew $(cat "$BITRISE_TEST_SELECTION_GRADLE_TASKS_PATH") --continue
            fi
    - script@1:
        title: Show selection
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            if [ -n "${BITRISE_TEST_SELECTION_PATH:-}" ]; then cat "$BITRISE_TEST_SELECTION_PATH"; fi
    - deploy-to-bitrise-io@2: {}

  # Shadow release check: the backend config injected as a workflow env, the test steps from their
  # test-selection-shadow branches. Every test runs; each step writes test-selection.json.
  shadow_tests:
    envs:
    - BITRISE_TEST_SELECTION_CONFIG_JSON: '{"mode":"shadow","base_ref":"main"}'
    steps:
    - git-clone@8: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - git::https://github.com/bitrise-steplib/bitrise-step-android-unit-test.git@test-selection-shadow:
        title: Android Unit Test (shadow branch)
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: "$VARIANT"
    - script@1:
        title: Show shadow reports
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            find "$BITRISE_TEST_DEPLOY_DIR" -name test-selection.json | sort | while read -r f; do echo "== $f"; cat "$f"; echo; done
    - deploy-to-bitrise-io@2: {}
